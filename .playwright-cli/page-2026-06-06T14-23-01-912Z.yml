                - paragraph [ref=e64]: Hemodynamically unstable Tile C pelvic fracture with negative FAST and CTA-documented arterial blush near the left internal iliac territory strongly points to pelvic arterial hemorrhage requiring immediate transcatheter control. Negative FAST makes intraperitoneal source unlikely, so source control is best achieved angiographically rather than by laparotomy. Gelfoam is preferred given coagulopathy and the need for rapid proximal-to-distal control of multiple potential branches, with coils reserved for a discrete pseudoaneurysm. Concurrent damage-control resuscitation, MTP activation, and pelvic binder/external fixation should continue.
