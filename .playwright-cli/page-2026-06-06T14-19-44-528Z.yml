                - generic [ref=e114]: Rationale
                - paragraph [ref=e115]: Hemodynamically unstable Tile C pelvic fracture with negative FAST and CTA-confirmed arterial blush in the left internal iliac territory points to pelvic arterial hemorrhage best controlled by transcatheter embolization. Gelfoam allows rapid proximal control in a coagulopathic patient, with coils reserved for a focal pseudoaneurysm or transected branch. Embolization is preferred over surgery since arterial pelvic bleeding is poorly accessible operatively and packing alone does not address arterial sources. Resuscitation, reversal of coagulopathy, and binder placement must continue in parallel.
